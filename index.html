<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Electronics – Lecture 1 Study Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link

    rel="stylesheet">
  <style>
    :root {
      --bg: #1b1917;
      --panel: #252220;
      --line: #3a3532;
      --tx: #ece6df;
      --mut: #a79f97;
      --acc: #ff6f59;
      --ok: #2e9e5b;
      --bad: #d64545;
      --warn: #e0b04a
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 70px
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.65 "JetBrains Mono", ui-monospace, Consolas, Menlo, monospace;
      overflow-x: hidden
    }

    .ar {
      font-family: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif;
      direction: rtl;
      unicode-bidi: isolate
    }

    header {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
      justify-content: space-between;
      padding: 22px 5vw;
      border-bottom: 1px solid var(--line)
    }

    h1 {
      margin: 0;
      font-size: 1.35rem
    }

    h1 b {
      color: var(--acc)
    }

    .sub {
      color: var(--mut);
      font-size: .85rem
    }

    .prog {
      display: flex;
      align-items: center;
      gap: 14px
    }

    .ring {
      position: relative;
      width: 84px;
      height: 84px
    }

    .ring svg {
      transform: rotate(-90deg)
    }

    .ring circle {
      fill: none;
      stroke-width: 7
    }

    .ring .bg {
      stroke: var(--line)
    }

    .ring .fg {
      stroke: var(--acc);
      stroke-linecap: round;
      transition: stroke-dashoffset .6s ease
    }

    #pct {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-weight: 700
    }

    #cnt {
      font-size: .85rem
    }

    button.reset {
      background: none;
      border: 1px solid var(--line);
      color: var(--mut);
      border-radius: 6px;
      padding: 4px 10px;
      font: inherit;
      font-size: .75rem;
      cursor: pointer;
      margin-top: 6px
    }

    button.reset:hover {
      border-color: var(--acc);
      color: var(--acc)
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 5vw;
      white-space: nowrap
    }

    nav a {
      color: var(--mut);
      text-decoration: none;
      font-size: .78rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 3px 9px
    }

    nav a:hover,
    nav a:focus-visible {
      color: var(--acc);
      border-color: var(--acc);
      outline: none
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 5vw 40px
    }

    .chap {
      color: var(--acc);
      margin: 34px 0 6px;
      font-size: 1.05rem
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 3px solid var(--acc);
      border-radius: 8px;
      padding: 18px 20px;
      margin-top: 14px
    }

    .card h2 {
      margin: 0 0 2px;
      font-size: 1.08rem
    }

    .card h2::before {
      content: "$ ";
      color: var(--acc)
    }

    .pg {
      color: var(--mut);
      font-size: .75rem;
      margin-bottom: 10px
    }

    .formula {
      background: #161412;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 14px;
      margin: 10px 0;
      color: #ffd2c8;
      overflow-x: auto
    }

    .formula div {
      white-space: nowrap
    }

    .card ul {
      margin: 8px 0;
      padding-left: 20px
    }

    .note,
    .flag {
      border-radius: 6px;
      padding: 8px 12px;
      margin: 10px 0;
      font-size: .85rem
    }

    .note {
      background: rgba(255, 111, 89, .1);
      border: 1px solid var(--acc)
    }

    .flag {
      background: rgba(224, 176, 74, .1);
      border: 1px solid var(--warn)
    }

    .qs {
      margin: 10px 0 0
    }

    .q {
      background: #201d1b;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      margin-top: 10px
    }

    .tag {
      display: inline-block;
      font-size: .7rem;
      border-radius: 4px;
      padding: 1px 7px;
      margin-bottom: 6px
    }

    .tag.pdf {
      background: var(--acc);
      color: #1b1917
    }

    .tag.ai {
      border: 1px solid var(--mut);
      color: var(--mut)
    }

    .q p {
      margin: 2px 0 10px
    }

    .opt {
      display: block;
      width: 100%;
      text-align: left;
      background: #2a2624;
      color: var(--tx);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 12px;
      margin: 6px 0;
      font: inherit;
      cursor: pointer
    }

    .opt:hover:not(:disabled) {
      border-color: var(--acc)
    }

    .opt:disabled {
      cursor: default;
      color: var(--tx)
    }

    .opt.ok {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff
    }

    .opt.bad {
      background: var(--bad);
      border-color: var(--bad);
      color: #fff
    }

    .fb {
      display: none;
      margin-top: 8px;
      font-size: .88rem
    }

    .fb.show {
      display: block
    }

    .fb.good {
      color: #6fd698
    }

    .fb.wrong {
      color: #ff8d8d
    }

    .ex {
      color: var(--mut);
      margin-top: 4px
    }

    footer {
      text-align: center;
      color: var(--mut);
      padding: 28px 5vw;
      border-top: 1px solid var(--line);
      font-size: .85rem
    }

    #warn {
      display: none;
      background: var(--warn);
      color: #1b1917;
      padding: 6px 5vw;
      font-size: .8rem
    }

    @media(max-width:560px) {
      .card {
        padding: 14px
      }

      .ring {
        width: 72px;
        height: 72px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      html {
        scroll-behavior: auto
      }

      .ring .fg {
        transition: none
      }
    }
  </style>
</head>

    /*ENGINE*/
    const KEY = "Elec_L1_2_3_1__progress_v1", L = "ABCD";
    let S = {};
    function load() {try {const r = localStorage.getItem(KEY); S = r ? (JSON.parse(r) || {}) : {}} catch (e) {S = {}; warn()} }
    function save() {try {localStorage.setItem(KEY, JSON.stringify(S))} catch (e) {warn()} }
    function warn() {document.getElementById("warn").style.display = "block"}
    const total = TOPICS.reduce((n, t) => n + t.qs.length, 0);
    function build() {
      let h = "", nv = "", lastCh = "";
      TOPICS.forEach(t => {
        if (t.ch && t.ch !== lastCh) {h += '<h3 class="chap">' + t.ch + '</h3>'; lastCh = t.ch}
        nv += '<a href="#' + t.id + '">' + t.t + '</a>';
        h += '<section class="card" id="' + t.id + '"><h2>' + t.t + '</h2><div class="pg">Source: ' + t.pg + '</div>' +
          '<div class="formula">' + t.f.map(x => '<div>' + x + '</div>').join("") + '</div>' +
          '<ul>' + t.ex.map(x => '<li>' + x + '</li>').join("") + '</ul>' +
          (t.note ? '<div class="note">★ ' + t.note + '</div>' : '') + (t.flag ? '<div class="flag">⚠ ' + t.flag + '</div>' : '') +
          '<div class="qs">' + t.qs.map((q, j) => {
            const id = t.id + "_" + j;
            return '<div class="q" data-id="' + id + '"><span class="tag ' + q.s + '">' + (q.s === "pdf" ? "Lecture question (from PDF)" : "AI-generated practice question") + '</span><p>' + q.q + '</p>' +
              q.o.map((o, k) => '<button type="button" class="opt" data-k="' + k + '">' + L[k] + ') ' + o + '</button>').join("") +
              '<div class="fb"></div></div>'
          }).join("") + '</div></section>';
      });
      document.getElementById("main").innerHTML = h;
      document.getElementById("nav").innerHTML = nv;
    }
    function findQ(id) {const p = id.split("_"); const t = TOPICS.find(x => x.id === p[0]); return t && t.qs[+p[1]]}
    function paint(box, q, pick) {
      box.querySelectorAll(".opt").forEach((b, k) => {b.disabled = true; if (k === q.a) b.classList.add("ok"); else if (k === pick) b.classList.add("bad")});
      const f = box.querySelector(".fb"), good = pick === q.a;
      f.className = "fb show " + (good ? "good" : "wrong");
      f.innerHTML = (good ? "✅ Correct Answer!" : "❌ Incorrect Answer — The correct answer is: " + L[q.a] + ") " + q.o[q.a] + ".") + '<div class="ex">' + q.e + '</div>';
    }
    function progress() {
      const n = Object.keys(S).filter(id => findQ(id)).length, p = total ? Math.round(n / total * 100) : 0;
      document.getElementById("fg").style.strokeDashoffset = 226.2 * (1 - (total ? n / total : 0));
      document.getElementById("pct").textContent = p + "%";
      document.getElementById("cnt").textContent = "Completed " + n + " / " + total + " Questions";
    }
    function restore() {
      document.querySelectorAll(".q").forEach(box => {
        const id = box.dataset.id, q = findQ(id);
        box.querySelectorAll(".opt").forEach(b => {b.disabled = false; b.className = "opt"});
        const f = box.querySelector(".fb"); f.className = "fb"; f.innerHTML = "";
        if (S[id] && Number.isInteger(S[id].a) && q) paint(box, q, S[id].a);
      });
      progress();
    }
    document.getElementById("main").addEventListener("click", e => {
      const b = e.target.closest(".opt"); if (!b || b.disabled) return;
      const box = b.closest(".q"), id = box.dataset.id, q = findQ(id);
      if (S[id]) return;
      const pick = +b.dataset.k;
      S[id] = {a: pick, ok: pick === q.a, done: true};
      save(); paint(box, q, pick); progress();
    });
    document.getElementById("reset").addEventListener("click", () => {
      if (!window.confirm("Clear all saved answers for this study file?")) return;
      S = {}; try {localStorage.removeItem(KEY)} catch (e) {warn()}
      restore();
    });
    load(); build(); restore();
  </script>
